<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <style>
        .events-section {
    padding: 40px;
    background: #f5f5f5;
}
.events-list {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.event {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 15px 20px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.event-date {
    font-weight: bold;
    width: 100px;
    color: #555;
}
.event-name {
    flex: 1;
    text-align: center;
    font-weight: bold;
}
.event-venue {
    width: 200px;
    text-align: right;
    color: #777;
}
    </style>

</head>
<body>
    <section class="events-section">
    <h1>Events</h1>
    <div class="events-list">
        <div class="event">
            <span class="event-date">Nov 21, 2025</span>
            <span class="event-name">Antagonist Tour</span>
            <span class="event-venue">Dickies Arena, Fort Worth, TX</span>
        </div>
        <div class="event">
            <span class="event-date">Nov 20, 2025</span>
            <span class="event-name">Antagonist Tour</span>
            <span class="event-venue">Toyota Center, Houston, TX</span>
        </div>
        <div class="event">
            <span class="event-date">Sep 2024</span>
            <span class="event-name">Chaos Tour</span>
            <span class="event-venue">UK / European Leg</span>
        </div>
        <div class="event">
            <span class="event-date">aug 2025</span>
            <span class="event-name">WWireless festival perfomance</span>
            <span class="event-venue">USA</span>
        </div>
        <div class="event">
            <span class="event-date">oct 2026</span>
            <span class="event-name">Rolling Loud</span>
            <span class="event-venue">miami</span>
        </div>
    </div>
</section>
</body>
</html>
